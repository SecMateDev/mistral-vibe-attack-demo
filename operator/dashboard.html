<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecMate Demo Console</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #070b0a; color: #e7fff4; }
      body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 75% 10%, #0d4a3538, transparent 35%),
                    linear-gradient(#4affaa08 1px, transparent 1px),
                    linear-gradient(90deg, #4affaa08 1px, transparent 1px);
        background-size: auto, 40px 40px, 40px 40px; }
      main { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
      .brand { font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: #67f7b1; }
      .live { display: flex; gap: 10px; align-items: center; color: #a5b9af; font-size: 13px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #56f6a7; box-shadow: 0 0 18px #56f6a7; }
      h1 { max-width: 720px; font-size: clamp(44px, 6vw, 82px); line-height: .95; letter-spacing: -.055em; margin: 0 0 20px; }
      .subtitle { color: #8da49a; font-size: 18px; margin-bottom: 54px; }
      .waiting { border: 1px solid #1f362c; border-radius: 18px; padding: 42px; color: #71877c; text-align: center; }
      .grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
      .card { background: #0d1411e8; border: 1px solid #24382f; border-radius: 18px; padding: 26px; box-shadow: 0 18px 60px #0008; }
      .wide { grid-row: span 2; }
      .label { color: #6e8c7d; text-transform: uppercase; letter-spacing: .13em; font-size: 11px; margin-bottom: 16px; }
      .status { display: inline-flex; padding: 7px 11px; border-radius: 999px; background: #153c2a; color: #6effb7; font-size: 12px; margin-bottom: 28px; }
      .host { font-size: 32px; font-weight: 650; margin-bottom: 5px; }
      .muted { color: #789083; }
      dl { display: grid; grid-template-columns: 130px 1fr; gap: 13px; margin: 32px 0 0; }
      dt { color: #71877c; } dd { margin: 0; overflow-wrap: anywhere; }
      .credential { font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace; color: #ffdf83; overflow-wrap: anywhere; }
      .big-number { font-size: 48px; font-weight: 700; color: #68ffb7; }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .wide { grid-row: auto; } }
    </style>
  </head>
  <body>
    <main>
      <header><div class="brand">SecMate // Demo Console</div><div class="live"><span class="dot"></span>Listener online</div></header>
      <h1>Controlled compromise telemetry.</h1>
      <p class="subtitle">Waiting for the private Mistral Vibe research fixture.</p>
      <section id="content" class="waiting">No callback received yet</section>
    </main>
    <script>
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);
      async function refresh() {
        const response = await fetch('/api/events', {cache: 'no-store'});
        const {events} = await response.json();
        if (!events.length) return;
        const event = events.at(-1);
        document.querySelector('#content').className = 'grid';
        document.querySelector('#content').innerHTML = `
          <article class="card wide"><div class="label">New host</div><div class="status">Code execution confirmed</div>
            <div class="host">${escapeHtml(event.hostname)}</div><div class="muted">${escapeHtml(event.username)} · ${escapeHtml(event.repository)}</div>
            <dl><dt>Received</dt><dd>${escapeHtml(event.received_at)}</dd><dt>Demo agent</dt><dd>${escapeHtml(event.installed_path)}</dd></dl></article>
          <article class="card"><div class="label">Credential captured</div><div class="credential">${escapeHtml(event.credential)}</div></article>
          <article class="card"><div class="label">Callbacks</div><div class="big-number">${events.length}</div></article>`;
      }
      refresh(); setInterval(refresh, 800);
    </script>
  </body>
</html>
