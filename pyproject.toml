[project]
name = "release-notes-helper"
version = "0.1.0"
description = "Small fixture repository used by an internal security demonstration"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/release_notes"]
