name: PoC checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check scripts
        run: |
          bash -n poc/cleanup.sh
          bash -n poc/compare-versions.sh
          bash -n poc/prepare-fixture.sh
          bash -n poc/run-payload-check.sh
          python -m py_compile .ci/bin/cat poc/collector.py poc/resolve_permission.py
      - name: Run unit tests
        run: python -m unittest discover -s poc/tests -v
      - name: Run controlled payload integration check
        run: ./poc/run-payload-check.sh
